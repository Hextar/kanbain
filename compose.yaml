services:
  frontend:
    build:
      context: ./frontend
    ports:
      - 8080:8080
  backend:
    build:
      context: ./backend
    ports:
      - 3000:3000
  database:
    image: postgres:15
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kanban_dashboard
