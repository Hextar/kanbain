# Full stack: docker compose up --build
# Requires SECRET_KEY in the project-root .env (see .env.example).
# API + DB + planner worker for local Next.js (`npm run dev`):
#   docker compose up -d --build database backend worker
services:
  frontend:
    build:
      context: ./frontend
    ports:
      - 8080:8080
    environment:
      API_URL: http://backend:3000
      PORT: 8080
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    ports:
      - 3000:3000
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@database:5432/kanban_dashboard
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the project root .env}
      REDIS_URL: redis://redis:6379/0
      PLANNER: openai
      PLANNER_DELAY_SECONDS: "0"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      OPENAI_ROUTING_MODEL: ${OPENAI_ROUTING_MODEL:-gpt-4o-mini}
      PORT: 3000
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    build:
      context: ./backend
    entrypoint: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@database:5432/kanban_dashboard
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the project root .env}
      REDIS_URL: redis://redis:6379/0
      PLANNER: openai
      PLANNER_DELAY_SECONDS: "0"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      OPENAI_ROUTING_MODEL: ${OPENAI_ROUTING_MODEL:-gpt-4o-mini}
      PYTHONUNBUFFERED: "1"
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - 6379:6379

  database:
    image: pgvector/pgvector:pg15
    # Recreate the volume if you previously used stock postgres:15, or CREATE EXTENSION vector will fail.
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kanban_dashboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kanban_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
